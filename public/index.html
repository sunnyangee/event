<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive GLTF Animation with Background</title>
  <style>
    @font-face {
      font-family: 'DungGeunMo';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'DungGeunMo', Arial, sans-serif;
    }
    #text-box {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
      color: #333;
      opacity: 0;
      transition: transform 0.5s ease, opacity 0.5s ease;
      white-space: pre-line; /* 텍스트 간격 유지 */
      width: 80%; /* 좌우 크기 확장 */
      max-height: 70%; /* 최대 높이 설정 */
      overflow-y: auto; /* 세로 스크롤 추가 */
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    #password-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 1000;
    }

    #password-input {
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-family: 'DungGeunMo', Arial, sans-serif;
      margin-top: 10px;
      text-align: center;
    }

    #password-button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      font-family: 'DungGeunMo', Arial, sans-serif;
      border: none;
      border-radius: 5px;
      background-color: #555;
      color: white;
      cursor: pointer;
    }

    #password-button:hover {
      background-color: #777;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background-color: #888;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: #555;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BaMS02FJ.js"></script>
</head>
<body>
  <div id="password-overlay">
    <h1>비밀번호를 입력하세요</h1>
    <input id="password-input" type="password" placeholder="비밀번호" maxlength="4">
    <button id="password-button">확인</button>
  </div>
  <div id="text-box" style="display: none;">정보가 로딩되고 있습니다...</div>
  <script>
    document.getElementById('password-button').addEventListener('click', () => {
      const passwordInput = document.getElementById('password-input').value;
      if (passwordInput === '2130') {
        document.getElementById('password-overlay').style.display = 'none';
        document.getElementById('text-box').style.display = 'block';
        document.getElementById('text-box').style.transform = 'translate(-50%, -50%) scale(1)';
        document.getElementById('text-box').style.opacity = '1';
      } else {
        alert('비밀번호가 잘못되었습니다. 다시 시도하세요.');
        document.getElementById('password-input').value = '';
      }
    });
  </script>
</body>
</html>
