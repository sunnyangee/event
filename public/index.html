<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Test Result</title>
  <style>
    @font-face {
      font-family: 'DungGeunMo';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'DungGeunMo', Arial, sans-serif;
    }
    #text-box {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
      color: #333;
      opacity: 0;
      transition: transform 0.5s ease, opacity 0.5s ease;
      white-space: pre-line; /* 텍스트 간격 유지 */
      width: 80%; /* 좌우 크기 확장 */
      max-height: 70%; /* 최대 높이 설정 */
      overflow-y: auto; /* 세로 스크롤 추가 */
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    #password-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 1000;
    }

    #password-input {
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-family: 'DungGeunMo', Arial, sans-serif;
      margin-top: 10px;
      text-align: center;
    }

    #password-button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      font-family: 'DungGeunMo', Arial, sans-serif;
      border: none;
      border-radius: 5px;
      background-color: #555;
      color: white;
      cursor: pointer;
    }

    #password-button:hover {
      background-color: #777;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background-color: #888;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div id="password-overlay">
    <h1>비밀번호를 입력하세요</h1>
    <input id="password-input" type="password" placeholder="비밀번호" maxlength="4">
    <button id="password-button">확인</button>
  </div>
  <div id="text-box" style="display: none;">정보가 로딩되고 있습니다...</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const magentaLight = new THREE.PointLight(0xff00ff, 10, 10, 0);
    magentaLight.position.set(2, 2, 2);
    scene.add(magentaLight);

    const blueLight = new THREE.PointLight(0x0000CD, 10, 10, 0);
    blueLight.position.set(-4, -2, 3);
    scene.add(blueLight);

    const loader = new GLTFLoader();
    const textureLoader = new THREE.TextureLoader();
    let mainModel, backgroundModel;
    const textBox = document.getElementById('text-box');
    const passwordOverlay = document.getElementById('password-overlay');
    let isClicked = false;

    const mainTexture = textureLoader.load('sd/textures/material_baseColor.jpeg');

    loader.load('sd/scene.gltf', (gltf) => {
      mainModel = gltf.scene;

      mainModel.traverse((child) => {
        if (child.isMesh) {
          child.material.map = mainTexture;
          child.material.needsUpdate = true;
        }
      });

      scene.add(mainModel);
      mainModel.position.set(0, 0, 0);
      mainModel.scale.set(0.05, 0.05, 0.05);
      mainModel.rotation.y = Math.PI / 5;
      mainModel.rotation.x = Math.PI / 6;
      mainModel.rotation.z = Math.PI / 4;
    });

    loader.load('tunnel/scene.gltf', (gltf) => {
      backgroundModel = gltf.scene;

      scene.add(backgroundModel);
      backgroundModel.position.set(0, -5, 0);
      backgroundModel.scale.set(5, 5, 5);
    });

    camera.position.set(-15, 3, 5);
    camera.lookAt(0, 0, 0);

    function animate() {
      requestAnimationFrame(animate);

      if (mainModel) {
        if (!isClicked) {
          mainModel.rotation.y += 0.02;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    function showTextBox(content) {
      textBox.style.transform = "translate(-50%, -50%) scale(1)";
      textBox.style.opacity = "1";
      textBox.innerHTML = content;
    }

    function hideTextBox(callback) {
      textBox.style.opacity = "0";
      textBox.style.transform = "translate(-50%, -50%) scale(0)";
      setTimeout(callback, 500);
    }

    function handleInteraction() {
      passwordOverlay.style.display = 'flex';
    }

    document.body.addEventListener('click', handleInteraction, { once: true });

    document.getElementById('password-button').addEventListener('click', () => {
      const passwordInput = document.getElementById('password-input').value;
      if (passwordInput === '2130') {
        passwordOverlay.style.display = 'none';
        textBox.style.display = 'block';
        textBox.style.transform = "translate(-50%, -50%) scale(1)";
        textBox.style.opacity = "1";

        window.addEventListener('click', showLoadingText);
        window.addEventListener('touchstart', showLoadingText);
      } else {
        alert('비밀번호가 잘못되었습니다. 다시 시도하세요.');
        document.getElementById('password-input').value = '';
      }
    });

    function showLoadingText() {
      if (mainModel && !isClicked) {
        isClicked = true;

        const scaleInterval = setInterval(() => {
          const scale = mainModel.scale.x - 0.0005;
          if (scale > 0.01) {
            mainModel.scale.set(scale, scale, scale);
          } else {
            clearInterval(scaleInterval);
          }
        }, 16);

        setTimeout(() => {
          showTextBox("정보가 로딩되고 있습니다...");

          setTimeout(() => {
            hideTextBox(() => {
              showTextBox(`<메모리 칩 감염 상태 차트>

[쥬료]
■■■■■■■■□□ 76%

[라벨]
■■■■■■□□□□ 58%

[이즈나]
■■■■■■□□□□ 58%

[소니아]
■■■■■■□□□□ 58%

[베디]
■■■■■■□□□□ 58%

[제리]
■■■■■■□□□□ 58%

[찬유]
■■■■■■□□□□ 58%

[시우]
■■■■■□□□□□ 47%

[아델]
■■■■■□□□□□ 47%

[엔젤]
■■■□□□□□□□ 32%

[달링]
■■■□□□□□□□ 32%

[스윙]
■■■□□□□□□□ 32%

[파사드]
■■■□□□□□□□ 32%

[프레이]
■■■□□□□□□□ 32%

[마노]
■■□□□□□□□□ 19%

[로지]
■■□□□□□□□□ 19%

[사베]
■■□□□□□□□□ 19%

[카피캣]
■■□□□□□□□□ 19%

[패치]
■■□□□□□□□□ 19%

[포나]
■■□□□□□□□□ 19%`);
            });
          }, 3000);
        }, 300);
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
