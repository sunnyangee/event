<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive GLTF Animation with Background</title>
  <style>
    @font-face {
      font-family: 'DungGeunMo';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #text-box {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-family: 'DungGeunMo', Arial, sans-serif;
      font-size: 16px;
      color: #333;
      opacity: 0;
      transition: transform 0.5s ease, opacity 0.5s ease;
      white-space: pre-line; /* 텍스트 간격 유지 */
      width: 80%; /* 좌우 크기 확장 */
      max-height: 70%; /* 최대 높이 설정 */
      overflow-y: auto; /* 세로 스크롤 추가 */
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background-color: #888;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: #555;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BaMS02FJ.js"></script>
</head>
<body>
  <div id="text-box">정보가 로딩되고 있습니다...</div>
</body>
</html>
